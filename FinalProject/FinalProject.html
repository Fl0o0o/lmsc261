<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <h1>DJ Drop Visual Controller</h1>

<video id="DJVIDEO" width="600" height="600" controls loop>
  <source src="./DJVJ_FLo.mp4" type="video/mp4"> 
</video>  
 

<button onclick="playVideo()">Play</button>
<button onclick="pauseVideo()">Pause</button>
<button onclick="drop()">Drop</button>
<button onclick="slowVideo()">Slow</button>
<button onclick="fastVideo()">Fast</button>
<button onclick="normalSpeed()">noraml</button>
<button onclick="toggleLoop()">Toggle Loop</button>
<button onclick="whiteGlitch()">White Glitch</button>



    <script>
        let video = document.getElementById("DJVJ_FLo");

  function playVideo() {
    video.play();
  }

  function pauseVideo() {
    video.pause();
  }

  function drop() {
    video.currentTime = 51;
    video.play();
  }
   function restartVideo() {
    video.currentTime = 0;
    video.play();
  }

function slowVideo() {
    video.playbackRate = 0.5;
  }

function fastVideo() {
    video.playbackRate = 2;
  }

function normalSpeed() {
    video.playbackRate = 1;
  }  
  function toggleLoop() {
  video.loop = !video.loop;
  }
   /*
   I received help from ChatGPT to understand how setTimeout works  
   and how to create a glitch effect.
   I understand how the code works and implemented it myself.  
   */
 function whiteGlitch() {
  video.style.filter = "brightness(8) contrast(2)";

  setTimeout(function() {
    video.style.filter = "none";
  }, 60);

  setTimeout(function() {
    video.style.filter = "brightness(8)";
  }, 120);

  setTimeout(function() {
    video.style.filter = "none";
  }, 200);
  
 }
</script>
  
</body>
</html>
